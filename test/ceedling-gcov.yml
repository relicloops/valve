---
# Static coverage mixin: plugin, compile/link flags, and gcovr report layout.
# Tool executables and argument tables are not defined here — Meson generates
# them into build/ceedling-toolchain.yml for the selected OS/compiler.
# Use via Meson (`meson test`) or the generated wrapper (`build/valve-ceedling`).
:plugins:
  :enabled:
    - gcov

:flags:
  :gcov:
    :compile:
      - -std=c23
      - -Wall
      - -Wextra
      - -Wpedantic
      # glibc: expose setenv/unsetenv under strict -std=c* (Linux CI).
      - -D_DEFAULT_SOURCE
      - -Dmalloc=vl_test_malloc
      - -Dcalloc=vl_test_calloc
      - -Drealloc=vl_test_realloc
      - -Dstrdup=vl_test_strdup
      - -Dstrndup=vl_test_strndup
      - --coverage
      - -DVALVE_VERSION=\"2.0.0-011\"
    :link:
      - --coverage
      # openpty (color TTY probes) lives in libutil on Linux and macOS.
      - -lutil

:gcov:
  :summaries: true
  :report_task: false
  :untested_sources: :compile
  :utilities:
    - gcovr
  :reports:
    - HtmlDetailed
  :gcovr:
    :report_root: .
    :report_include: "^src/"
    :report_exclude: "(^|/)build/"
    :gcov_exclude: "(^|/)build/"
    :exclude_directories: "(^|/)build($|/)"
    :object_directory: .cache/ceedling
    :html_artifact_filename: valve-coverage.html
    :html_title: Valve coverage
    :html_medium_threshold: 75
    :html_high_threshold: 90
    :print_summary: true
    :threads: 4
